<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feliz Navisquad – coming soon</title>
  <meta name="description" content="A bodyweight Advent calendar: 10 minutes of movement every day. Starts 1 December. / Ein Adventskalender mit 10 Minuten Bewegung pro Tag. Start: 1. Dezember.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 { font-size: 2.25rem; margin: 0 0 0.25rem; }
    .lang { margin: 1.5rem 0; }
    .lang p { margin: 0.25rem 0; }
    .date { font-weight: 600; }
    hr { width: 4rem; border: none; border-top: 1px solid currentColor; opacity: 0.3; }
  </style>
</head>
<body>
  <main>
    <h1>Feliz Navisquad</h1>

    <section class="lang" lang="en">
      <p>A bodyweight Advent calendar: 10 minutes of movement, every day.</p>
      <p class="date">Door 1 opens on 1 December.</p>
    </section>

    <hr>

    <section class="lang" lang="de">
      <p>Ein Adventskalender ohne Geräte: 10 Minuten Bewegung, jeden Tag.</p>
      <p class="date">Das erste Türchen öffnet sich am 1. Dezember.</p>
    </section>
  </main>
</body>
</html>
